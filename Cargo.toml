[package]
name = "imgsort"
version = "0.1.0"
edition = "2021"
description = "基于 CLIP (tract/ONNX) 的批量图片内容识别与分类工具"

[[bin]]
name = "imgsort"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
image = "0.25"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"
tract-onnx = "0.23.9"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
